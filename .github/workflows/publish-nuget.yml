name: Publish NuGet package

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'   # v1.2.3, v1.2.3-beta.1, ...

permissions:
  contents: read
  packages: write

env:
  PROJECT_PATH: src/Domeneshop.Api.Client/Domeneshop.Api.Client.csproj
  PACKAGE_ID: Chhaugen.Domeneshop.Api.Client
  NUGET_SOURCE: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore "$PROJECT_PATH"

      - name: Build
        run: >
          dotnet build "$PROJECT_PATH"
          --configuration Release
          --no-restore
          -p:Version=${{ steps.version.outputs.version }}

      - name: Pack
        run: >
          dotnet pack "$PROJECT_PATH"
          --configuration Release
          --no-build
          --output ./artifacts
          -p:Version=${{ steps.version.outputs.version }}
          -p:PackageId=$PACKAGE_ID
          -p:RepositoryUrl=${{ github.server_url }}/${{ github.repository }}
          -p:RepositoryType=git

      - name: Push to GitHub Packages
        run: >
          dotnet nuget push "./artifacts/*.nupkg"
          --source "$NUGET_SOURCE"
          --api-key ${{ secrets.GITHUB_TOKEN }}
          --skip-duplicate

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: ./artifacts/*.nupkg